<svg xmlns="http://www.w3.org/2000/svg" width="260" height="270" viewBox="0 -30 260 270">
  <style>
    .steam { fill: none; stroke: #c9b8a6; stroke-width: 6; stroke-linecap: round; opacity: 0; animation: rise 3s ease-in-out infinite; }
    .s2 { animation-delay: 1s; }
    .s3 { animation-delay: 2s; }
    @keyframes rise {
      0%   { opacity: 0; transform: translateY(14px); }
      30%  { opacity: .9; }
      100% { opacity: 0; transform: translateY(-22px); }
    }
    .cup { animation: bob 3s ease-in-out infinite; transform-origin: 130px 200px; }
    @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    .eye { animation: blink 4s infinite; transform-origin: center; transform-box: fill-box; }
    @keyframes blink { 0%,92%,100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
    .cursor { animation: cur 1s steps(1) infinite; }
    @keyframes cur { 50% { opacity: 0; } }
  </style>

  <path class="steam"    d="M100 70 q-12 -16 0 -32 q12 -16 0 -32"/>
  <path class="steam s2" d="M130 70 q-12 -16 0 -32 q12 -16 0 -32"/>
  <path class="steam s3" d="M160 70 q-12 -16 0 -32 q12 -16 0 -32"/>

  <g class="cup">
    <ellipse cx="130" cy="212" rx="92" ry="12" fill="#000" opacity=".25"/>
    <path d="M196 110 h14 a28 28 0 0 1 0 56 h-18" fill="none" stroke="#f2a65a" stroke-width="14"/>
    <path d="M58 86 h144 l-10 104 a22 22 0 0 1 -22 20 h-80 a22 22 0 0 1 -22 -20 z" fill="#f2a65a"/>
    <ellipse cx="130" cy="88" rx="72" ry="12" fill="#6b3e26"/>
    <ellipse cx="130" cy="88" rx="72" ry="12" fill="none" stroke="#e08c3c" stroke-width="4"/>

    <!-- face -->
    <ellipse class="eye" cx="108" cy="138" rx="8" ry="10" fill="#2b1a10"/>
    <ellipse class="eye" cx="152" cy="138" rx="8" ry="10" fill="#2b1a10"/>
    <circle cx="111" cy="134" r="3" fill="#fff"/>
    <circle cx="155" cy="134" r="3" fill="#fff"/>
    <ellipse cx="92" cy="156" rx="9" ry="5" fill="#ff7a7a" opacity=".55"/>
    <ellipse cx="168" cy="156" rx="9" ry="5" fill="#ff7a7a" opacity=".55"/>
    <path d="M120 156 q10 10 20 0" fill="none" stroke="#2b1a10" stroke-width="4" stroke-linecap="round"/>

    <!-- code on the mug -->
    <text x="130" y="190" text-anchor="middle" font-family="Consolas, monospace" font-size="15" font-weight="bold" fill="#6b3e26">&lt;/&gt;<tspan class="cursor">_</tspan></text>
  </g>
</svg>
